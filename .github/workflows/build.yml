name: Build Fabric sources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: fabric-${{ matrix.minecraft }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: farmers-delight-fabric-${{ matrix.minecraft }}
          path: fabric-${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error
